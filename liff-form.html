  hero.innerHTML = `<div class="sum-grand od-hero" style="margin-bottom:12px;background:#B8860B"><div class="sg-total" style="margin:2px 0 4px">${rqData.pendingCount}</div>
      <div class="sg-label">${t('spReqCount')}</div></div>
    <div class="hint" style="margin:0 4px 6px">${tFmt('spReqRule', { d: rqData.rule.days, a: Number(rqData.rule.minAmount).toLocaleString('en-US') })}</div>
    <div class="hint" style="margin:0 4px 12px">${tFmt('spReqWho', { n: escH(rqData.approverName), id: escH(rqData.approverId) })}</div>
    ${sub}<button type="button" class="od-save" id="rqScan" style="margin:0 0 12px">${t('spReqScan')}</button>`;
  const q = (query || '').trim().toLowerCase();
  const list = q ? rqData.requests.filter(r => [r.customerName, r.customerId, r.salesName, r.salesId].some(v => String(v || '').toLowerCase().includes(q))) : rqData.requests;
  box.innerHTML = list.length ? list.map(r => rqCard(r, open)).join('')
    : `<div class="empty-state">${q ? t('spNoMatch') : (rqView === 'pending' ? t('spReqNone') : t('spReqHistNone'))}</div>`;
}

function rqBadges(){
  const n = rqData && rqData.pendingCount ? rqData.pendingCount : '';
  el('spReqBadge').textContent = n; el('spBadge').textContent = n;
}

async function rqLoad(quiet){
  if (!isFinance || !profile.userId) return;
  const my = ++rqReq, view = rqView;
  try {
    const d = await (await fetch(`${GAS_ENDPOINT}?action=stopRequests&view=${view}&lineUserId=${encodeURIComponent(profile.userId)}&_=${Date.now()}`, { cache: 'no-store' })).json();
    if (my !== rqReq) return;
    if (d.error) throw new Error(d.error);
    rqData = d; rqBadges();
    if (rqShown()) window.__spReq.render(window.__spReqQuery || '', window.__spReqOpen || {});
  } catch (err) {
    if (!quiet && rqShown()) el('stopList').innerHTML = `<div class="empty-state">${t('mineLoadError')}</div>`;
  }
}

window.__spReq = {
  render: function(query, open){ window.__spReqQuery = query; window.__spReqOpen = open; rqRender(query, open); },
  load: function(){ return rqLoad(false); }
};

/* sub-tabs + scan button live in the hero block */
el('spHero').addEventListener('click', async e => {
  const sb = e.target.closest('.rq-sub');
  if (sb && sb.dataset.v !== rqView) { rqView = sb.dataset.v; rqData = null; rqRender('', {}); rqLoad(false); return; }
  if (e.target.id === 'rqScan') {
    const b = e.target; b.disabled = true; const old = b.textContent; b.textContent = t('spReqScanBusy');
    try {
      const r = await rqPost({ action: 'stopScan' });
      if (!r || !r.success) showToast((r && r.error) || t('saveErr'), true);
      else { showToast(tFmt('spReqScanDone', { n: r.created, c: r.cancelled })); rqData = null; rqLoad(false); return; }
    } catch (x) { showToast(t('saveConnErr'), true); }
    b.disabled = false; b.textContent = old;
  }
});

/* approve / reject (server re-checks that it is really the approver) */
el('stopList').addEventListener('click', async e => {
  const b = e.target.closest('.rq-go'); if (!b) return;
  const card = b.closest('.od-card'), act = b.dataset.act;
  if (act === 'rejectOpen') { card.querySelector('.rq-rej').style.display = 'block'; card.querySelector('.rq-note').focus(); return; }
  const err = card.querySelector('.od-err');
  err.className = 'od-err';
  let note = '';
  if (act === 'reject') {
    note = card.querySelector('.rq-note').value.trim();
    if (!note) { err.textContent = t('spReqReason'); err.className = 'od-err show'; return; }
  }
  b.disabled = true;
  try {
    const r = await rqPost({ action: 'stopDecision', requestId: card.dataset.rid, decision: act === 'approve' ? 'Approved' : 'Rejected', note: note });
    if (!r || !r.success) { err.textContent = (r && r.error) || t('saveErr'); err.className = 'od-err show'; b.disabled = false; rqLoad(true); return; }
    showToast(t('spReqDone')); rqData = null; rqRender('', {}); rqLoad(false);
  } catch (x) { err.textContent = t('saveConnErr'); err.className = 'od-err show'; b.disabled = false; }
});

const rqPrevLang = applyLanguage;
applyLanguage = function(l){ rqPrevLang(l); if (rqData && rqShown()) window.__spReq.render(window.__spReqQuery || '', window.__spReqOpen || {}); };
const rqPrevLists = loadLists;
loadLists = async function(){
  await rqPrevLists();
  el('spReqBtn').style.display = isFinance && !isGuest ? '' : 'none';
  if (isFinance && !isGuest) rqLoad(true);          // quietly fills the red count on the Stop supply tab
};
})();

/* ---------- ONLY F-001: export the stop-supply list as Excel ---------- */
(function(){
Object.assign(I18N.en, { spExpXlsx:'📥 Export Stop Supply Excel' });
Object.assign(I18N.th, { spExpXlsx:'📥 ส่งออก Excel รายการหยุดส่งสินค้า' });

async function runStopExport(){
  const msg = el('spExpMsg'), btn = el('spXlsxBtn');
  btn.disabled = true;
  msg.className = 'hint';
  msg.textContent = t('odExpBusy');
  try {
    const url = `${GAS_ENDPOINT}?action=exportStopSupply&lineUserId=${encodeURIComponent(profile.userId)}&_=${Date.now()}`;
    const d = await (await fetch(url, { cache: 'no-store' })).json();
    if (!d || !d.success) throw new Error((d && d.error) || t('odExpErr'));

    msg.textContent = '';
    const a = document.createElement('a');
    a.href = d.downloadUrl; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = t('odExpReady') + ' — ' + d.name;
    a.style.cssText = 'color:var(--primary-dark);font-weight:600';
    msg.appendChild(a);

    if (window.liff && liff.isInClient()) liff.openWindow({ url: d.downloadUrl, external: true });
    else window.open(d.downloadUrl, '_blank');
  } catch (err) {
    msg.className = 'hint error';
    msg.textContent = err.message || t('odExpErr');
  } finally {
    btn.disabled = false;
  }
}
el('spXlsxBtn').addEventListener('click', runStopExport);

// Show the button ONLY for F-001. The server decides (canExportReport) and re-checks on every export call.
const spPrevLists = loadLists;
loadLists = async function(){
  await spPrevLists();
  el('spExport').style.display = (window.__canExport && !isGuest) ? 'block' : 'none';
};
})();

/* ---------- GUEST ACCOUNTS ("G-"): upload ONE test receipt, then ONLY the stop-supply list ---------- */
(function(){
Object.assign(I18N.en, { guestHint:'Guest account — upload one test receipt to unlock the stop-supply list.' });
Object.assign(I18N.th, { guestHint:'บัญชีผู้เยี่ยมชม — อัปโหลดใบเสร็จทดสอบ 1 ใบ เพื่อดูรายการหยุดส่งสินค้า' });
function applyGuest(){
  if (!isGuest) return;
  document.querySelector('.tabs').style.display = 'none';        // guests never see the tab bar
  el('viewAsField').style.display = 'none';
  el('spView').style.display = 'none';                           // current stop-supply list only (no Removed / Requests)
  el('spAdmin').style.display = 'none';
  el('spExport').style.display = 'none';
  if (!guestHasReceipt) {
    el('guestHint').style.display = 'block';
    switchTab('new');
  } else {
    el('guestHint').style.display = 'none';
    switchTab('stop');
  }
}
const gPrevLists = loadLists;
loadLists = async function(){ await gPrevLists(); applyGuest(); };
})();

/* ---------- init ---------- */
(async function init(){
  liffStatus.sdkPresent = !!window.liff;

  if (window.liff) {
    try {
      await liff.init({ liffId: LIFF_ID });
      liffStatus.isInClient = liff.isInClient();

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const p = await liff.getProfile();
      if (!p || !p.userId) {
        throw new Error('liff.getProfile() returned no userId');
      }
      profile = { userId: p.userId, displayName: p.displayName };
      liffStatus.initOk = true;
    } catch (err) {
      liffStatus.error = err && err.message ? err.message : String(err);
      console.error('LIFF identity setup failed:', err);
    }
  } else {
    liffStatus.error = 'LIFF SDK did not load (blocked, offline, or script tag failed)';
    console.error(liffStatus.error);
  }

  const today = new Date();
  const iso = today.toISOString().slice(0, 10);
  el('paymentDate').value = iso;
  createBillRow();
  applyLanguage(currentLang);
  await loadLists();
})();
</script>
</body>
