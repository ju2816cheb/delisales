<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Log a Receipt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    /* ---- Red & white theme ---- */
    --primary:#D6293E;
    --primary-dark:#A81F30;
    --primary-bg:#FDECEE;
    --ink:#1A1A1A;
    --ink-soft:#65605F;
    --page-bg:#FFFFFF;
    --card:#FFFFFF;
    --border:#ECD9DA;
    --amber:#B8860B;
    --amber-bg:#FFF6E5;
    --danger:#8C1327;
    --danger-bg:#F6E3E1;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans Thai','Helvetica Neue',Arial,sans-serif;
    background:var(--page-bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,label,.headline{ font-family:'Kanit','Noto Sans Thai',sans-serif; }

  .wrap{ max-width:480px; margin:0 auto; padding:16px 16px 110px; }

  /* --- Header --- */
  header{ padding:6px 4px 16px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  header .eyebrow{ font-size:12px; font-weight:600; color:var(--primary-dark); letter-spacing:.04em; text-transform:uppercase; }
  header h1{ margin:2px 0 0; font-size:21px; font-weight:600; }

  /* --- Language toggle --- */
  .lang-toggle{ display:flex; gap:4px; background:var(--primary-bg); padding:3px; border-radius:9px; flex-shrink:0; margin-top:2px; }
  .lang-btn{
    border:none; background:transparent; padding:6px 10px; border-radius:7px;
    font-family:'Kanit',sans-serif; font-size:12.5px; font-weight:600; color:var(--primary-dark);
    cursor:pointer; opacity:.55;
  }
  .lang-btn.active{ background:var(--primary); color:#fff; opacity:1; }

  /* --- Live chat-bubble receipt preview --- */
  .bubble-row{ display:flex; margin-top:4px; margin-bottom:4px; }
  .bubble{
    background:var(--primary);
    color:#fff;
    border-radius:16px 16px 16px 4px;
    padding:14px 16px;
    max-width:100%;
    flex:1;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .bubble .bt{ font-size:11px; opacity:.85; margin-bottom:6px; font-weight:500; }
  .bubble .bl{ font-size:14px; line-height:1.65; }
  .bubble .bl b{ font-weight:600; }
  .bubble .empty{ opacity:.85; font-size:13.5px; }
  .bubble .bill-line{ display:flex; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .bubble .bill-line .cn{ opacity:.9; }
  .bubble .divider{ height:1px; background:rgba(255,255,255,.3); margin:8px 0; }
  .bubble .amt{ font-size:20px; font-weight:700; margin-top:4px; }
  .bubble .amt.neg{ color:#FFD9DC; }

  /* --- Card / section --- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  label{ display:block; font-size:13px; font-weight:600; margin-bottom:7px; color:var(--ink); }
  label .req{ color:var(--primary-dark); }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  select, input[type=text], input[type=number], input[type=date]{
    width:100%;
    font-size:16px;
    font-family:inherit;
    padding:12px 14px;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
  }
  select:focus, input:focus{ outline:none; border-color:var(--primary); }
  select:disabled{ background-color:var(--primary-bg); color:var(--ink); opacity:1; border-color:var(--primary); }
  .hint.verified{ color:var(--primary-dark); font-weight:600; }
  .hint.unverified{ color:var(--amber); }
  .hint.error{ color:var(--danger); font-weight:600; }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%2365605F' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    padding-right:34px;
  }

  /* customer search */
  .search-box{ position:relative; }
  .results{
    position:absolute; left:0; right:0; top:calc(100% + 6px);
    background:#fff; border:1.5px solid var(--border); border-radius:10px;
    max-height:220px; overflow-y:auto; z-index:20;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    display:none;
  }
  .results.open{ display:block; }
  .result-item{ padding:11px 14px; font-size:14.5px; border-bottom:1px solid var(--border); cursor:pointer; }
  .result-item:last-child{ border-bottom:none; }
  .result-item:active{ background:var(--primary-bg); }
  .result-item .id{ font-weight:600; }
  .result-item .name{ color:var(--ink-soft); font-size:13px; }
  .no-results{ padding:14px; font-size:13.5px; color:var(--ink-soft); }

  .selected-customer{
    margin-top:8px; padding:10px 12px; background:var(--primary-bg); border-radius:10px;
    font-size:13.5px; display:none; align-items:center; justify-content:space-between;
  }
  .selected-customer.show{ display:flex; }
  .selected-customer .clear{ color:var(--primary-dark); font-weight:600; cursor:pointer; }

  /* payment type segmented control */
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; padding:12px 6px; border-radius:10px; border:1.5px solid var(--border);
    background:#fff; font-family:inherit; font-size:14px; font-weight:600; color:var(--ink-soft);
    cursor:pointer;
  }
  .seg button.active{ border-color:var(--primary); background:var(--primary-bg); color:var(--primary-dark); }

  .cheque-panel{
    margin-top:14px; padding:14px; background:var(--amber-bg); border:1px solid #F0DBA3; border-radius:10px;
    display:none;
  }
  .cheque-panel.show{ display:block; }
  .cheque-panel label{ color:#7A5800; }

  /* --- Multi invoice / credit note / note rows --- */
  #billRows{ margin-bottom:10px; }
  .bill-row{
    border:1.5px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px;
  }
  .bill-row:last-child{ margin-bottom:0; }
  .bill-row-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .bill-type-toggle{ display:flex; gap:6px; flex-wrap:wrap; }
  .bt-btn{
    padding:6px 10px; border-radius:8px; border:1.5px solid var(--border); background:#fff;
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .bt-btn.active{ border-color:var(--primary); background:var(--primary-bg); color:var(--primary-dark); }
  .bt-btn.credit.active{ border-color:var(--danger); background:var(--danger-bg); color:var(--danger); }
  .bt-btn.note.active{ border-color:var(--amber); background:var(--amber-bg); color:var(--amber); }
  .remove-row{ font-size:12.5px; color:var(--danger); font-weight:600; cursor:pointer; padding:4px 2px; flex-shrink:0; }
  .bill-row-fields{ display:flex; gap:8px; }
  .bill-row-fields .bill-no{ flex:1.3; }
  .bill-row-fields .amount-prefix{ flex:1; margin:0; }
  .amount-prefix.small input{ font-size:15px; padding:11px 12px 11px 30px; }
  .amount-prefix.small span{ left:12px; font-size:14.5px; }
  .add-bill-btn{
    width:100%; padding:11px; border-radius:10px; border:1.5px dashed var(--primary); background:var(--primary-bg);
    color:var(--primary-dark); font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .bills-total{
    display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px;
    border-top:1px dashed var(--border); font-size:13.5px; font-weight:600; color:var(--ink-soft);
  }
  .bills-total .val{ font-size:16px; color:var(--ink); }
  .bills-total .val.neg{ color:var(--danger); }

  /* per-line customer */
  .row-cust-wrap{ margin-bottom:8px; }
  .row-cust-lbl{ font-size:12px; color:var(--ink-soft); margin-bottom:5px; }
  .row-cust{
    padding:10px 12px; background:var(--primary-bg); border-radius:10px; font-size:13.5px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; word-break:break-word;
  }
  .row-cust .clear{ color:var(--primary-dark); font-weight:600; cursor:pointer; flex-shrink:0; }
  .bill-row input.row-cust-search, .bill-row input.note-cust{ font-size:15px; padding:11px 12px; }
  .bill-row .note-cust{ margin-bottom:8px; }
  .bill-row textarea.note-text{
    width:100%; font-size:15px; font-family:inherit; padding:11px 12px; border:1.5px solid var(--border);
    border-radius:10px; min-height:64px; resize:vertical; color:var(--ink); margin-top:8px;
  }
  .bill-row textarea.note-text:focus{ outline:none; border-color:var(--primary); }

  /* open invoices picker — scrolling drop-down list */
  .row-open:empty{ display:none; }
  .open-inv{ margin-bottom:8px; }
  .row-open .hint{ margin:0 0 4px; }
  .oi-dd{ border:1.5px solid var(--border); border-radius:10px; background:#fff; margin-top:6px; overflow:hidden; }
  .oi-dd.open{ border-color:var(--primary); }
  .oi-toggle{
    width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:11px 12px; border:none; background:#fff; font-family:inherit; font-size:14px;
    font-weight:600; color:var(--ink); cursor:pointer; text-align:left;
  }
  .oi-toggle .oi-ph{ color:var(--ink-soft); font-weight:500; }
  .oi-toggle .oi-arrow{ color:var(--ink-soft); font-size:12px; flex-shrink:0; }
  .oi-list{ display:none; max-height:240px; overflow-y:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--border); }
  .oi-dd.open .oi-list{ display:block; }
  .oi-opt{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; font-size:13.5px;
  }
  .oi-opt:last-child{ border-bottom:none; }
  .oi-opt:active{ background:var(--primary-bg); }
  .oi-opt.on{ background:var(--primary-bg); }
  .oi-opt .oi-no{ font-weight:600; word-break:break-all; }
  .oi-opt .oi-sub{ display:block; font-size:11.5px; color:var(--ink-soft); font-weight:400; margin-top:2px; }
  .oi-opt .oi-amt{ font-weight:700; white-space:nowrap; }
  .oi-opt.cr .oi-amt{ color:var(--danger); }

  /* --- Receipt photo picker (up to 10) --- */
  .photo-btn-row{ display:flex; gap:8px; }
  .photo-btn{
    flex:1; width:100%; padding:13px 8px; border:1.5px dashed var(--border); border-radius:10px;
    background:#FFF9F9; color:var(--ink-soft); font-family:inherit; font-size:13.5px; font-weight:600;
    cursor:pointer;
  }
  .photo-grid{ display:none; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:8px; margin:0 0 10px; }
  .photo-grid.show{ display:grid; }
  .photo-grid .ph{ position:relative; }
  .photo-grid .ph img{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; border:1px solid var(--border); display:block; }
  .photo-grid .ph-x{
    position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
    background:rgba(26,26,26,.75); color:#fff; font-size:12px; line-height:22px; text-align:center; cursor:pointer;
  }
  .photo-count{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-left:6px; }

  .amount-prefix{ position:relative; }
  .amount-prefix span{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:16px; }
  .amount-prefix input{ padding-left:34px; }

  /* --- Sticky submit bar --- */
  .submit-bar{
    position:fixed; left:0; right:0; bottom:0;
    background:linear-gradient(180deg, rgba(255,255,255,0) 0%, var(--page-bg) 35%);
    padding:18px 16px 20px;
  }
  .submit-bar .inner{ max-width:480px; margin:0 auto; }
  button.submit{
    width:100%; padding:15px; border:none; border-radius:12px;
    background:var(--primary); color:#fff; font-family:'Kanit',sans-serif; font-size:16px; font-weight:600;
    cursor:pointer;
  }
  button.submit:disabled{ background:#D8B9BC; }
  .error-text{ color:var(--danger); font-size:12.5px; margin-top:6px; display:none; }
  .error-text.show{ display:block; }

  .toast{
    position:fixed; top:16px; left:16px; right:16px; max-width:448px; margin:0 auto;
    background:var(--ink); color:#fff; padding:13px 16px; border-radius:10px; font-size:14px;
    display:none; z-index:50; text-align:center;
  }
  .toast.show{ display:block; }
  .toast.err{ background:var(--danger); }

  /* --- Tabs --- */
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab-btn{
    flex:1; padding:10px 4px; border-radius:10px; border:1.5px solid var(--border); background:#fff;
    font-family:'Kanit',sans-serif; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .tab-btn.active{ border-color:var(--primary); background:var(--primary-bg); color:var(--primary-dark); }

  /* --- My receipts --- */
  .empty-state{ text-align:center; padding:44px 16px; color:var(--ink-soft); font-size:13.5px; }
  .mr-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px;
  }
  .mr-card.voided{ opacity:.6; }
  .mr-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .mr-date{ font-size:12px; color:var(--ink-soft); }
  .mr-customer{ font-size:14.5px; font-weight:600; margin-top:2px; }
  .mr-total{ font-size:16px; font-weight:700; white-space:nowrap; }
  .mr-total.neg{ color:var(--danger); }
  .mr-bills{ border-top:1px dashed var(--border); padding-top:8px; margin-top:4px; }
  .mr-bill-line{ display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--ink-soft); padding:2px 0; }
  .mr-bill-line span.neg{ color:var(--danger); }
  .mr-sub{ display:block; font-size:11.5px; opacity:.85; word-break:break-word; }
  .mr-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .mr-status{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .mr-card.voided .mr-status{ color:var(--danger); }
  .mr-actions{ display:flex; }
  .mr-action{ font-size:12.5px; font-weight:600; color:var(--primary-dark); cursor:pointer; margin-left:14px; }
  .mr-action.danger{ color:var(--danger); }

  /* --- Totals tab --- */
  .summary-seg{ display:flex; gap:8px; margin-bottom:14px; }
  .summary-seg button{
    flex:1; padding:11px 4px; border-radius:10px; border:1.5px solid var(--border);
    background:#fff; font-family:'Kanit',sans-serif; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .summary-seg button.active{ border-color:var(--primary); background:var(--primary-bg); color:var(--primary-dark); }
  .sum-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .sum-card .sum-label{ font-size:14.5px; font-weight:600; }
  .sum-card .sum-count{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .sum-card .sum-total{ font-size:16.5px; font-weight:700; white-space:nowrap; }
  .sum-card .sum-total.neg{ color:var(--danger); }
  .sum-grand{
    display:flex; justify-content:space-between; align-items:center; padding:14px 16px;
    background:var(--primary); color:#fff; border-radius:var(--radius); margin-bottom:14px;
  }
  .sum-grand .sg-label{ font-size:13px; opacity:.9; font-weight:600; }
  .sum-grand .sg-total{ font-size:20px; font-weight:700; }

  /* --- Debug panel (only shown when ?debug=1 is in the URL) --- */
  .debug-panel{
    display:none; margin-bottom:12px; padding:10px 12px; background:#FFF7F7; border:1px dashed var(--danger);
    border-radius:10px; font-size:11.5px; color:var(--ink-soft); white-space:pre-wrap; word-break:break-all;
  }
  .debug-panel.show{ display:block; }
.od-search{margin-bottom:10px}
.od-hero{display:block}
.od-card{border:1px solid var(--border);border-left-width:4px;border-radius:var(--radius);margin-bottom:10px;background:#fff;overflow:hidden}
.od-card.need{border-left-color:var(--primary)}
.od-card.done{border-left-color:#1F7A4D}
.od-card.prob{border-left-color:var(--amber)}
.od-head{padding:14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.od-name{font-size:14.5px;font-weight:600;word-break:break-word}
.od-sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.od-right{text-align:right;flex-shrink:0}
.od-amt{font:700 16.5px 'Kanit',sans-serif;white-space:nowrap}
.od-amt.neg{color:var(--danger)}
.od-chip{display:inline-block;margin-top:6px;margin-right:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px}
.od-chip.need{background:var(--primary-bg);color:var(--primary-dark)}
.od-chip.ok{background:#E6F4EC;color:#1F7A4D}
.od-chip.prob{background:var(--amber-bg);color:var(--amber)}
.od-chip.d1{background:var(--amber-bg);color:var(--amber)}
.od-chip.d2{background:var(--primary-bg);color:var(--primary-dark)}
.od-chip.d3{background:var(--danger-bg);color:var(--danger)}
.od-body{padding:0 14px 14px}
.od-line{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:7px 0;border-top:1px dashed var(--border);color:var(--ink-soft)}
.od-line b{color:var(--ink);font-weight:600}
.od-line .od-chip{margin:0 0 0 4px;padding:1px 7px}
.od-line.cn span:last-child{color:var(--danger)}
.od-lbl{display:block;font:600 13px 'Kanit',sans-serif;margin:16px 0 7px}
.od-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.od-pill{padding:8px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font:600 12.5px inherit;font-family:inherit;color:var(--ink-soft);cursor:pointer}
.od-pill.on{border-color:var(--primary);background:var(--primary-bg);color:var(--primary-dark)}
.od-form textarea{width:100%;font-size:16px;font-family:inherit;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;min-height:64px;resize:vertical;color:var(--ink)}
.od-form textarea:focus{outline:none;border-color:var(--primary)}
.od-old{margin-top:16px;padding:12px;background:var(--amber-bg);border:1px solid #F0DBA3;border-radius:10px}
.od-old .od-oh{font:600 13px 'Kanit',sans-serif;color:#7A5800;margin-bottom:8px}
.od-oldrow{margin-bottom:10px}
.od-oldrow .od-ol{font-size:12.5px;color:#7A5800;margin-bottom:4px}
.od-copy{font-size:12.5px;font-weight:600;color:var(--primary-dark);cursor:pointer}
.od-save{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;background:var(--primary);color:#fff;font:600 15.5px 'Kanit',sans-serif;cursor:pointer}
.od-save:disabled{background:#D8B9BC}
.od-err{color:var(--danger);font-size:12.5px;font-weight:600;margin-top:10px;display:none}
.od-err.show{display:block}
.od-last{font-size:12.5px;background:var(--amber-bg);border-radius:8px;padding:8px 10px;margin-top:10px;color:#7A5800}
.od-divider{font-size:12px;font-weight:600;color:var(--ink-soft);margin:16px 2px 8px}
#odBadge{background:var(--primary);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:4px}
#odBadge:empty{display:none}
.tabs{flex-wrap:wrap}
.tab-btn{flex:1 1 28%}
#apBadge{background:var(--primary);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:4px}
#apBadge:empty{display:none}
#spBadge,#spReqBadge{background:var(--primary);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:4px}
#spBadge:empty,#spReqBadge:empty{display:none}
.rq-btns{display:flex;gap:8px;margin-top:12px}
.rq-btns .od-save{margin-top:0;flex:1}
.rq-rej{display:none;margin-top:10px}
.rq-rej input{width:100%;font-size:16px;font-family:inherit;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;color:var(--ink)}
.ap-note{margin-top:0}
.ap-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.ap-thumbs.one{grid-template-columns:1fr}
.ap-thumb{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--border);margin:0;cursor:zoom-in;background:#f6f2f2}
.ap-thumbs.one .ap-thumb{max-height:230px}
#apLb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;flex-direction:column}
#apLb .lb-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#fff;font-size:14px}
#apLb .lb-top a,#apLb .lb-top span{color:#fff;font-weight:600;cursor:pointer}
#apLb .lb-nav{display:flex;align-items:center;gap:14px;font-size:18px}
#apLb .lb-nav #apLbCount{font-size:13px;cursor:default}
#apLb .lb-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
#apLb img{max-width:100%;max-height:100%;object-fit:contain}
#apLb .lb-acts{display:flex;gap:10px;padding:14px 16px 22px}
#apLb .lb-acts button{flex:1;padding:14px;border:none;border-radius:12px;font:600 15.5px 'Kanit',sans-serif;color:#fff;cursor:pointer}

<body>

<div class="toast" id="toast"></div>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-i18n="eyebrow">Sales Receipt</div>
      <h1 data-i18n="title">Log a customer receipt</h1>
    </div>
    <div class="lang-toggle" id="langToggle">
      <button type="button" class="lang-btn" data-lang="th">ไทย</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </header>

  <div class="debug-panel" id="debugPanel"></div>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="tabNewBtn" data-i18n="tabNew">New receipt</button>
    <button type="button" class="tab-btn" id="tabMineBtn" data-i18n="tabMine">My receipts</button>
    <button type="button" class="tab-btn" id="tabSummaryBtn" data-i18n="tabSummary">Totals</button>
    <button type="button" class="tab-btn" id="tabOverdueBtn"><span data-i18n="tabOverdue">Overdue</span><span id="odBadge"></span></button>
    <button type="button" class="tab-btn" id="tabStopBtn"><span data-i18n="tabStop">Stop supply</span><span id="spBadge"></span></button>
    <button type="button" class="tab-btn" id="tabApprBtn" style="display:none"><span data-i18n="apprTab">Approvals</span><span id="apBadge"></span></button>
  </div>

  <!-- Finance-only: lets a Finance account switch which salesperson's
       My receipts / Totals / Overdue they're looking at. Includes an
       "All salespeople" option (value "*") that only affects Overdue.
       Hidden entirely for everyone else. Filing (New receipt) always
       stays locked to your own identity. -->
  <div class="field" id="viewAsField" style="display:none; margin:0 4px 14px;">
    <label data-i18n="viewingAs">Viewing data for</label>
    <select id="viewAsSelect"></select>
  </div>

  <div id="tabNew">
  <div class="od-last" id="guestHint" style="display:none;margin:0 4px 14px" data-i18n="guestHint"></div>
  <form id="receiptForm">
    <div class="card">
      <div class="field">
        <label><span data-i18n="salesperson">Sales person</span> <span class="req">*</span></label>
        <select id="salesperson" required>
          <option value="" disabled selected data-i18n="salespersonPlaceholder">Select sales person</option>
        </select>
        <div class="hint" id="identityHint" style="display:none;"></div>
      </div>

      <div class="field" style="margin-bottom:0;">
        <label><span data-i18n="paymentDate">Payment date</span> <span class="req">*</span></label>
        <input type="date" id="paymentDate" required />
        <div class="hint" data-i18n="paymentDateHint">Defaults to today — change if logging a past receipt.</div>
      </div>
    </div>

    <div class="card">
      <div class="field" style="margin-bottom:0;">
        <label><span data-i18n="bills">Invoices</span> <span class="req">*</span></label>
        <div id="billRows"></div>
        <button type="button" class="add-bill-btn" id="addBillBtn" data-i18n="addBill">+ Add another line</button>
        <div class="hint" id="billsHintText"></div>
        <div class="bills-total">
          <span data-i18n="total">Total</span>
          <span class="val" id="billsTotalVal">฿ 0.00</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="field" style="margin-bottom:0;">
        <label data-i18n="paymentType">Payment type <span class="req">*</span></label>
        <div class="seg" id="paymentSeg">
          <button type="button" data-value="Cash" data-i18n="cash">Cash</button>
          <button type="button" data-value="Transfer" data-i18n="transfer">Transfer</button>
          <button type="button" data-value="Cheque" data-i18n="cheque">Cheque</button>
        </div>

        <div class="cheque-panel" id="chequePanel">
          <div class="field">
            <label><span data-i18n="chequeType">Cheque type</span> <span class="req">*</span></label>
            <input type="text" id="chequeType" data-i18n-placeholder="chequeTypePlaceholder" placeholder="e.g. Company, Personal, PDC" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label><span data-i18n="chequeDate">Cheque date</span> <span class="req">*</span></label>
            <input type="date" id="chequeDate" />
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="field" style="margin-bottom:0;">
        <label><span data-i18n="receiptImage">Receipt photos</span> <span class="req">*</span><span class="photo-count" id="photoCount"></span></label>
        <input type="file" id="receiptCameraInput" accept="image/*" capture="environment" style="display:none;" />
        <input type="file" id="receiptGalleryInput" accept="image/*" multiple style="display:none;" />
        <div class="photo-grid" id="photoPreview"></div>
        <div class="photo-btn-row" id="photoBtnRow">
          <button type="button" class="photo-btn" id="cameraBtn" data-i18n="takePhoto">📷 Take photo</button>
          <button type="button" class="photo-btn" id="galleryBtn" data-i18n="chooseGallery">🖼️ Choose from gallery</button>
        </div>
      </div>
    </div>

    <!-- Live preview — placed last, right above the sticky Save button. -->
    <div class="bubble-row">
      <div class="bubble" id="preview">
        <div class="bt" data-i18n="previewLabel">Will be recorded as</div>
        <div class="bl" id="previewBody"><span class="empty" data-i18n="previewEmpty">Fill in the form below — this preview updates as you go.</span></div>
      </div>
    </div>

    <div class="error-text" id="formError">Please complete all required fields.</div>
  </form>
  </div>

  <div id="tabMine" style="display:none;">
    <div class="hint" id="mineHintText" style="margin:0 4px 14px;"></div>
    <div id="myReceiptsList"></div>
  </div>

  <div id="tabSummary" style="display:none;">
    <div class="hint" id="summaryHintText" style="margin:0 4px 14px;"></div>
    <div class="summary-seg" id="summarySeg">
      <button type="button" data-group="day" data-i18n="groupDay">By day</button>
      <button type="button" data-group="month" class="active" data-i18n="groupMonth">By month</button>
      <button type="button" data-group="customer" data-i18n="groupCustomer">By customer</button>
    </div>
    <div id="summaryGrand"></div>
    <div id="summaryList"></div>
  </div>

  <div id="tabOverdue" style="display:none;">
    <div id="odHero"></div>

    <!-- Only F-001 (Justin): export the Overdue Report as an Excel file (button is hidden for everyone else) -->
    <div id="odExport" style="display:none; margin:0 0 12px;">
      <button type="button" class="od-save" id="odXlsxBtn" style="margin-top:0;" data-i18n="odExpXlsx">📥 Export Excel</button>
      <div class="hint" id="odExpMsg"></div>
    </div>

    <input type="text" id="odSearch" class="od-search" data-i18n-placeholder="odSearch" placeholder="Search customer name or code" autocomplete="off" />
    <div class="summary-seg" id="odFilter">
      <button type="button" data-f="needs" class="active" data-i18n="odNeeds">Needs reply</button>
      <button type="button" data-f="all" data-i18n="odAll">All</button>
      <button type="button" data-f="prob" data-i18n="odProblems">Problems</button>
    </div>
    <div id="overdueList"></div>
  </div>

  <div id="tabAppr" style="display:none;">
    <div class="sum-grand od-hero" id="apHero" style="margin-bottom:12px;background:#B8860B;display:block"></div>
    <div class="summary-seg" id="apView">
      <button type="button" data-v="pending" class="active" data-i18n="apprPending">Pending</button>
      <button type="button" data-v="history" data-i18n="apprHistory">History</button>
    </div>
    <div id="apList"></div>
  </div>

  <div id="tabStop" style="display:none;">
    <div class="summary-seg" id="spView">
      <button type="button" data-v="current" class="active" data-i18n="spCurrent">On stop supply</button>
      <button type="button" data-v="removed" data-i18n="spRemoved">Removed</button>
      <button type="button" data-v="requests" id="spReqBtn" style="display:none"><span data-i18n="spReqTab">Requests</span><span id="spReqBadge"></span></button>
    </div>
    <div id="spAdmin" style="display:none;margin-bottom:12px">
      <button type="button" class="od-save" id="spAddToggle" style="margin-top:0" data-i18n="spAdd">➕ Add customer to stop supply</button>
      <div id="spAddPanel" style="display:none;margin-top:10px">
        <input type="text" id="spAddSearch" class="od-search" data-i18n-placeholder="spAddSearch" placeholder="Search customer to add" autocomplete="off" />
        <div id="spAddResults" style="border-radius:10px;overflow:hidden"></div>
        <div id="spAddInfo"></div>
      </div>
    </div>
    <!-- Only F-001: export the stop-supply list as an Excel file (hidden for everyone else) -->
    <div id="spExport" style="display:none;margin-bottom:12px">
      <button type="button" class="od-save" id="spXlsxBtn" style="margin-top:0" data-i18n="spExpXlsx">📥 Export Stop Supply Excel</button>
      <div class="hint" id="spExpMsg"></div>
    </div>
    <div id="spHero"></div>
    <input type="text" id="spSearch" class="od-search" data-i18n-placeholder="spSearch" placeholder="Search customer name or code" autocomplete="off" />
    <div id="stopList"></div>
  </div>
</div>

<div class="submit-bar" id="submitBar">
  <div class="inner">
    <button type="submit" form="receiptForm" class="submit" id="submitBtn" data-i18n="saveReceipt">Save receipt</button>
  </div>
</div>

<!-- Receipt photo viewer (Approvals tab).
     This block MUST come BEFORE the <script> below, otherwise el('apLbClose') is null when the
     Approvals code runs and the rest of the page (including init()) never starts. -->
<div id="apLb">
  <div class="lb-top"><a id="apLbOpen" target="_blank" rel="noopener">↗ Drive</a><span class="lb-nav"><span id="apLbPrev">‹</span><span id="apLbCount"></span><span id="apLbNext">›</span></span><span id="apLbClose">✕</span></div>
  <div class="lb-img"><img id="apLbImg" alt="" /></div>
  <div class="lb-acts" id="apLbActs">
    <button type="button" id="apLbOk" style="background:#1F7A4D">✅</button>
    <button type="button" id="apLbNo" style="background:#8C1327">✖</button>
  </div>
</div>

try {
  const saved = localStorage.getItem('receiptFormLang');
  if (saved === 'en' || saved === 'th') currentLang = saved;
} catch (err) { /* localStorage unavailable — default to Thai */ }

function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key; }
function tFmt(key, vars){
  let s = t(key);
  Object.keys(vars || {}).forEach(k => { s = s.replace(`{${k}}`, vars[k]); });
  return s;
}

function applyLanguage(lang){
  currentLang = lang;
  try { localStorage.setItem('receiptFormLang', lang); } catch (err) { /* ignore */ }
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach(node => {
    node.textContent = t(node.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(node => {
    node.placeholder = t(node.getAttribute('data-i18n-placeholder'));
  });

  el('billsHintText').innerHTML = t('billsHint');
  el('mineHintText').textContent = t('mineHint');
  el('summaryHintText').textContent = t('summaryHint');

  [...el('langToggle').children].forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

  // keep the "All salespeople" label in the viewer switcher in the right language
  const allOpt = el('viewAsSelect').querySelector('option[value="*"]');
  if (allOpt) allOpt.textContent = t('allSales');

  renderBillRows();
  updatePreview();
  if (el('tabMine').style.display !== 'none') renderMyReceipts();
  if (el('tabSummary').style.display !== 'none') renderSummary();
}

function el(id){ return document.getElementById(id); }

let customers = [];
let salespersons = [];
let selectedSalesperson = null;  // who this LINE account is registered as — always the identity used for filing/void
let isGuest = false, guestHasReceipt = false;   // guest ("G-") accounts: upload one test receipt, then only the stop-supply list
let canApproveStop = false;      // true ONLY for the stop-supply approver (F-002) — the server decides and re-checks
let stopApprover = { id: 'F-002', name: 'F-002' };
let isFinance = false;           // true when the logged-in identity's Sales ID starts with "F-"
let viewedSalesperson = null;    // whose My receipts / Totals / Overdue are currently shown; Finance accounts can change this
let paymentType = null;
let receiptImages = [];          // up to MAX_PHOTOS compressed data-URLs
let profile = { userId: "", displayName: "" };

let liffStatus = { sdkPresent: false, initOk: false, isInClient: false, error: null };

let billRows = [];
let rowCounter = 0;
let openInv = {};                // customerId -> { state:'loading'|'ok', list:[...] }  (from ?action=openInvoices)
let myReceiptsCache = [];
let summaryGroupBy = 'month';
let summaryCache = [];

function money(n){
  const num = parseFloat(n);
  if (isNaN(num)) return "0.00";
  return Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatSigned(n){
  const num = parseFloat(n) || 0;
  return (num < 0 ? '-฿ ' : '฿ ') + money(num);
}

/* label for one receipt line: "Invoice 123" / "CN 123" / "Note" */
function lineLabel(b){
  if (b.type === 'Note') return t('note');
  return (b.type === 'Credit Note' ? 'CN' : t('bill')) + ' ' + escH(b.billNo);
}
/* left side of a receipt line in My receipts / Approvals: label + customer (+ note text) */
function lineHtml_(b){
  const isNote = b.type === 'Note';
  let main = lineLabel(b) + (isNote && b.noteCustomer ? ' · ' + escH(b.noteCustomer) : '');
  const cust = (!isNote || (b.customerId && b.customerId !== 'OTHER' && b.customerId !== 'NOTE')) ? (b.customerName || '') : '';
  const sub = [cust ? escH(cust) : '', isNote && b.noteText ? escH(b.noteText) : ''].filter(Boolean).join(' — ');
  return main + (sub ? `<span class="mr-sub">${sub}</span>` : '');
}

/* ---------- multi line rows: invoice / credit note / note — each with its own customer ---------- */
function createBillRow(initType){
  rowCounter++;
  const prev = billRows.length ? billRows[billRows.length - 1] : null;
  billRows.push({
    rowId: 'row' + rowCounter, type: initType || 'Invoice',
    customer: prev && prev.customer ? prev.customer : null,   // new line starts with the previous line's customer (change it if needed)
    search: '', billNo: '', amount: '', noteCustomer: '', noteText: '', invOpen: false
  });
  renderBillRows();
}

function removeBillRow(rowId){
  billRows = billRows.filter(r => r.rowId !== rowId);
  if (billRows.length === 0) { createBillRow(); return; }
  renderBillRows();
}

function customerBlockHtml(r){
  const lbl = r.type === 'Note' ? t('noteCustOpt') : t('customer');
  if (r.customer) {
    return `<div class="row-cust-wrap"><div class="row-cust-lbl">${lbl}</div>
      <div class="row-cust"><span>${escH(r.customer.id)} — ${escH(r.customer.name)}</span><span class="clear" data-action="clearCust">${t('change')}</span></div></div>`;
  }
  return `<div class="row-cust-wrap"><div class="row-cust-lbl">${lbl}</div>
      <div class="search-box"><input type="text" class="row-cust-search" placeholder="${escH(t('customerPlaceholder'))}" value="${escH(r.search)}" autocomplete="off" />
      <div class="results row-results"></div></div></div>`;
}

/* open invoices: scrolling drop-down (tap the box, pick an invoice, it fills number + amount) */
function openInvHtml(r){
  if (r.type === 'Note' || !r.customer) return '';
  const s = openInv[r.customer.id];
  if (!s) return '';
  if (s.state === 'loading') return `<div class="hint">${t('openInvLoading')}</div>`;
  const used = {};
  billRows.forEach(x => { if (x !== r && x.customer && x.customer.id === r.customer.id && x.billNo.trim()) used[x.billNo.trim()] = 1; });
  const list = s.list.filter(i => !used[i.invoiceNo]);
  if (!list.length) return `<div class="hint">${t('openInvNone')}</div>`;

  const optInner = i =>
    `<span><span class="oi-no">${escH(i.invoiceNo)}${i.credit ? ' · ' + t('creditNote') : ''}</span>` +
    `<span class="oi-sub">${i.dueDate ? escH(i.dueDate) + ' · ' : ''}${i.days}${t('odDays')}${i.partial ? ' · ' + t('spPartial') : ''}</span></span>` +
    `<span class="oi-amt">${i.credit ? '-' : ''}฿${money(i.remaining)}</span>`;

  const cur = list.find(i => i.invoiceNo === r.billNo.trim());
  const head = cur ? optInner(cur) : `<span class="oi-ph">${t('openInvPick')}</span>`;
  const opts = list.map(i =>
    `<div class="oi-opt ${i.credit ? 'cr' : ''} ${cur && cur.invoiceNo === i.invoiceNo ? 'on' : ''}" data-inv="${escH(i.invoiceNo)}">${optInner(i)}</div>`
  ).join('');

  return `<div class="open-inv"><div class="hint">${t('openInvTitle')} (${list.length})</div>` +
    `<div class="oi-dd ${r.invOpen ? 'open' : ''}">` +
    `<button type="button" class="oi-toggle">${head}<span class="oi-arrow">${r.invOpen ? '▲' : '▼'}</span></button>` +
    `<div class="oi-list">${opts}</div></div></div>`;
}

/* refresh only the open-invoice strips (never touches the inputs, so typing is not interrupted) */
function refreshOpenInv(){
  document.querySelectorAll('#billRows .bill-row').forEach(node => {
    const r = billRows.find(x => x.rowId === node.dataset.rowId);
    const box = node.querySelector('.row-open');
    if (r && box) box.innerHTML = openInvHtml(r);
  });
}

async function loadOpenInv(cid){
  if (!cid) return;
  if (openInv[cid]) { refreshOpenInv(); return; }
  if (!profile.userId) return;
  openInv[cid] = { state: 'loading', list: [] };
  refreshOpenInv();
  try {
    const url = `${GAS_ENDPOINT}?action=openInvoices&lineUserId=${encodeURIComponent(profile.userId)}&customerId=${encodeURIComponent(cid)}&_=${Date.now()}`;
    const d = await (await fetch(url, { cache: 'no-store' })).json();
    if (d && Array.isArray(d.invoices)) openInv[cid] = { state: 'ok', list: d.invoices };
    else delete openInv[cid];
  } catch (err) { delete openInv[cid]; }
  refreshOpenInv();
}

function renderBillRows(){
  const container = el('billRows');
  if (!container) return;
  container.innerHTML = billRows.map(r => {
    const isNote = r.type === 'Note';
    const fields = isNote ? `
      <input type="text" class="note-cust" placeholder="${escH(t('noteCustPh'))}" value="${escH(r.noteCustomer)}" />
      <div class="bill-row-fields">
        <div class="amount-prefix small"><span>฿</span>
          <input type="number" class="bill-amount" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${escH(r.amount)}" /></div>
      </div>
      <textarea class="note-text" placeholder="${escH(t('noteTextPh'))}">${escH(r.noteText)}</textarea>` : `
      <div class="bill-row-fields">
        <input type="text" class="bill-no" placeholder="${escH(t('billNoPlaceholder'))}" value="${escH(r.billNo)}" />
        <div class="amount-prefix small">
          <span>฿</span>
          <input type="number" class="bill-amount" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${escH(r.amount)}" />
        </div>
      </div>`;
    return `
    <div class="bill-row" data-row-id="${r.rowId}">
      <div class="bill-row-head">
        <div class="bill-type-toggle">
          <button type="button" class="bt-btn ${r.type === 'Invoice' ? 'active' : ''}" data-type="Invoice">${t('bill')}</button>
          <button type="button" class="bt-btn credit ${r.type === 'Credit Note' ? 'active' : ''}" data-type="Credit Note">${t('creditNote')}</button>
          <button type="button" class="bt-btn note ${isNote ? 'active' : ''}" data-type="Note">${t('note')}</button>
        </div>
        ${billRows.length > 1 ? `<span class="remove-row" data-action="remove">${t('remove')}</span>` : ''}
      </div>
      ${customerBlockHtml(r)}
      <div class="row-open">${openInvHtml(r)}</div>
      ${fields}
    </div>`;
  }).join('');
  updatePreview();
}

function showRowResults(node, data){
  const box = node.querySelector('.row-results');
  if (!box) return;
  const q = data.search.trim().toLowerCase();
  if (!q) { box.className = 'results row-results'; box.innerHTML = ''; return; }
  const matches = customers.filter(c =>
    String(c.id).toLowerCase().includes(q) || String(c.name).toLowerCase().includes(q)
  ).slice(0, 20);
  box.innerHTML = matches.length
    ? matches.map(c => `
        <div class="result-item" data-id="${escH(c.id)}" data-name="${escH(c.name)}">
          <div class="id">${escH(c.id)}</div>
          <div class="name">${escH(c.name)}</div>
        </div>`).join('')
    : `<div class="no-results">${t('noMatchingCustomer')}</div>`;
  box.className = 'results row-results open';
}

el('billRows').addEventListener('click', (e) => {
  const row = e.target.closest('.bill-row');
  if (!row) return;
  const data = billRows.find(r => r.rowId === row.dataset.rowId);
  if (!data) return;

  const typeBtn = e.target.closest('.bt-btn');
  if (typeBtn) { data.type = typeBtn.dataset.type; renderBillRows(); return; }

  if (e.target.closest('[data-action="remove"]')) { removeBillRow(row.dataset.rowId); return; }

  if (e.target.closest('[data-action="clearCust"]')) {
    data.customer = null; data.search = ''; data.invOpen = false;
    renderBillRows();
    return;
  }

  const item = e.target.closest('.result-item');
  if (item && item.dataset.id) {
    data.customer = { id: item.dataset.id, name: item.dataset.name };
    data.search = '';
    renderBillRows();
    loadOpenInv(data.customer.id);
    return;
  }

  // open the / close the invoice drop-down
  const tog = e.target.closest('.oi-toggle');
  if (tog) { data.invOpen = !data.invOpen; refreshOpenInv(); return; }

  // pick an invoice from the drop-down
  const opt = e.target.closest('.oi-opt');
  if (opt && data.customer) {
    const s = openInv[data.customer.id];
    const inv = s && s.list.find(i => i.invoiceNo === opt.dataset.inv);
    if (inv) {
      data.type = inv.credit ? 'Credit Note' : 'Invoice';
      data.billNo = inv.invoiceNo;
      data.amount = String(Math.round(Math.abs(inv.remaining) * 100) / 100);
      data.invOpen = false;
      renderBillRows();
    }
    return;
  }
});

el('billRows').addEventListener('input', (e) => {
  const row = e.target.closest('.bill-row');
  if (!row) return;
  const data = billRows.find(r => r.rowId === row.dataset.rowId);
  if (!data) return;
  if (e.target.classList.contains('row-cust-search')) { data.search = e.target.value; showRowResults(row, data); return; }
  if (e.target.classList.contains('bill-no')) { data.billNo = e.target.value; refreshOpenInv(); }
  if (e.target.classList.contains('bill-amount')) data.amount = e.target.value;
  if (e.target.classList.contains('note-cust')) data.noteCustomer = e.target.value;
  if (e.target.classList.contains('note-text')) data.noteText = e.target.value;
  updatePreview();
});

el('addBillBtn').addEventListener('click', () => {
  createBillRow();
  const last = billRows[billRows.length - 1];
  if (last && last.customer) loadOpenInv(last.customer.id);
});

function getSignedBills(){
  return billRows
    .filter(r => r.billNo.trim() || r.amount || r.noteCustomer.trim() || r.noteText.trim() || r.customer)
    .map(r => {
      const isNote = r.type === 'Note';
      const raw = Math.abs(parseFloat(r.amount) || 0);
      const signed = r.type === 'Credit Note' ? -raw : raw;
      const c = r.customer;
      return {
        type: r.type,
        billNo: isNote ? '' : r.billNo.trim(),
        amount: signed,
        // every line carries its own customer. A Note with no listed customer uses id "OTHER" (the id Code.gs already skips in the Overdue Report) + the typed name.
        customerId: c ? c.id : (isNote ? 'OTHER' : ''),
        customerName: c ? c.name : (isNote ? r.noteCustomer.trim() : ''),
        noteCustomer: isNote ? r.noteCustomer.trim() : '',
        noteText: isNote ? r.noteText.trim() : ''
      };
    });
}

function updatePreview(){
  const bills = getSignedBills();
  const total = bills.reduce((sum, b) => sum + b.amount, 0);
  el('billsTotalVal').className = 'val' + (total < 0 ? ' neg' : '');
  el('billsTotalVal').textContent = formatSigned(total);

  const chequeType = el('chequeType').value.trim();
  const chequeDate = el('chequeDate').value;

  if (!selectedSalesperson && bills.length === 0) {
    el('previewBody').innerHTML = `<span class="empty">${t('previewEmpty')}</span>`;
    return;
  }

  let lines = [];
  if (selectedSalesperson) lines.push(`<b>${escH(selectedSalesperson.name)}</b> (${escH(selectedSalesperson.id)})`);
  if (paymentType) {
    let pt = t(paymentType === 'Cash' ? 'cash' : paymentType === 'Transfer' ? 'transfer' : 'cheque');
    if (paymentType === 'Cheque') {
      let extra = [chequeType, chequeDate].filter(Boolean).join(', ');
      if (extra) pt += ` (${escH(extra)})`;
    }
    lines.push(pt);
  }

  let html = lines.join('<br/>');

  if (bills.length) {
    html += '<div class="divider"></div>';
    html += bills.map(b => {
      const label = b.type === 'Credit Note' ? 'CN' : b.type === 'Note' ? t('note') : t('bill');
      const num = b.type === 'Note' ? '' : ' ' + escH(b.billNo || '—');
      const who = b.type === 'Note' ? (b.noteCustomer || b.customerName) : b.customerName;
      const sub = who ? `<br/><span style="opacity:.85;font-size:12.5px">${escH(who)}</span>` : '';
      return `<div class="bill-line"><span>${label}${num}${sub}</span><span class="${b.type === 'Credit Note' ? 'cn' : ''}">${formatSigned(b.amount)}</span></div>`;
    }).join('');
  }

  if (receiptImages.length) html += `<div style="margin-top:4px; font-size:12.5px; opacity:.9;">📎 ${t('receiptImage').replace(/\s*\(.*\)\s*$/, '')} × ${receiptImages.length}</div>`;
  html += `<div class="amt${total < 0 ? ' neg' : ''}">${formatSigned(total)}</div>`;

  el('previewBody').innerHTML = html;
}

function showToast(msg, isErr){
  const t2 = el('toast');
  t2.textContent = msg;
  t2.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t2.className = 'toast', 2600);
}

/* ---------- receipt photos: read + compress client-side before upload (up to MAX_PHOTOS) ---------- */
function fileToCompressedDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1600;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPhotos(){
  const grid = el('photoPreview');
  grid.className = 'photo-grid' + (receiptImages.length ? ' show' : '');
  grid.innerHTML = receiptImages.map((src, i) =>
    `<div class="ph"><img src="${src}" alt="" /><span class="ph-x" data-i="${i}">✕</span></div>`).join('');
  el('photoCount').textContent = receiptImages.length ? `${receiptImages.length}/${MAX_PHOTOS}` : '';
  el('photoBtnRow').style.display = receiptImages.length >= MAX_PHOTOS ? 'none' : 'flex';
  updatePreview();
}

async function addPhotos(fileList){
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const room = MAX_PHOTOS - receiptImages.length;
  if (files.length > room) showToast(tFmt('photoMax', { n: MAX_PHOTOS }), true);
  for (const f of files.slice(0, Math.max(room, 0))) {
    try { receiptImages.push(await fileToCompressedDataUrl(f)); }
    catch (err) { showToast(t('photoErr'), true); }
  }
  renderPhotos();
}

el('cameraBtn').addEventListener('click', () => el('receiptCameraInput').click());
el('galleryBtn').addEventListener('click', () => el('receiptGalleryInput').click());
el('receiptCameraInput').addEventListener('change', (e) => { addPhotos(e.target.files); e.target.value = ''; });
el('receiptGalleryInput').addEventListener('change', (e) => { addPhotos(e.target.files); e.target.value = ''; });

el('photoPreview').addEventListener('click', (e) => {

  receiptImages.splice(Number(x.dataset.i), 1);

});

/* ---------- Finance "viewing data for" switcher ---------- */
// Populates the switcher from the salespersons list already loaded.
// Finance accounts also get an "All salespeople" option (value "*") that
// the Overdue tab uses to show the whole list + grand total.
function populateViewAsSelect(){
  const sel = el('viewAsSelect');
  sel.innerHTML = '';
  if (isFinance) {
    const o = document.createElement('option');
    o.value = '*';
    o.textContent = t('allSales');
    sel.appendChild(o);
  }
  salespersons.forEach(sp => {
    const opt = document.createElement('option');
    opt.value = sp.id;
    opt.textContent = sp.name && sp.name.trim() ? sp.name : sp.id;
    sel.appendChild(opt);
  });
  if (viewedSalesperson) sel.value = viewedSalesperson.id;
}

el('viewAsSelect').addEventListener('change', (e) => {
  // "*" (All salespeople) only changes the Overdue tab; My receipts / Totals
  // fall back to your own data in that case.
  const sp = salespersons.find(s => s.id === e.target.value);
  viewedSalesperson = sp || selectedSalesperson;
  if (el('tabMine').style.display !== 'none') loadMyReceipts();
  if (el('tabSummary').style.display !== 'none') loadSummary();
});

/* ---------- load salesperson + customer lists ---------- */
async function loadLists(){
  try {
    const qs = profile.userId ? `&lineUserId=${encodeURIComponent(profile.userId)}` : '';
    const cacheBust = `&_=${Date.now()}`;
    const res = await fetch(`${GAS_ENDPOINT}?action=lists${qs}${cacheBust}`, { cache: 'no-store' });
    const data = await res.json();
    salespersons = data.salespersons || [];
    customers = data.customers || [];
    window.__matchedSalesId = data.matchedSalesId || null;

    const sel = el('salesperson');
    salespersons.forEach(sp => {
      const opt = document.createElement('option');
      opt.value = sp.id;
      opt.textContent = sp.name && sp.name.trim() ? sp.name : sp.id;
      sel.appendChild(opt);
    });

    const hint = el('identityHint');
    isFinance = !!data.isFinance;
    isGuest = !!data.isGuest;
    guestHasReceipt = !!data.guestHasReceipt;
    canApproveStop = !!data.canApproveStop;
    stopApprover = { id: data.stopApproverId || 'F-002', name: data.stopApproverName || data.stopApproverId || 'F-002' };
    window.__canExport = !!data.canExportReport;   // true ONLY for F-001 (decided by the server)

    if (data.matchedSalesId) {
      const match = salespersons.find(sp => sp.id === data.matchedSalesId);
      if (match) {
        sel.value = match.id;
        sel.disabled = true;
        selectedSalesperson = match;
        viewedSalesperson = match; // default: view your own data
        hint.textContent = tFmt('matchedAs', { name: match.name && match.name.trim() ? match.name : match.id });
        hint.className = 'hint verified';
        hint.style.display = 'block';
        updatePreview();
      } else {
        hint.textContent = tFmt('linkedMismatch', { id: data.matchedSalesId });
        hint.className = 'hint error';
        hint.style.display = 'block';
      }
    } else if (profile.userId) {
      hint.textContent = t('notLinked');
      hint.className = 'hint unverified';
      hint.style.display = 'block';
    } else if (liffStatus.error) {
      hint.textContent = t('identityFail');
      hint.className = 'hint error';
      hint.style.display = 'block';
    }

    populateViewAsSelect();
    el('viewAsField').style.display = (isFinance && el('tabNew').style.display === 'none') ? 'block' : 'none';
  } catch (err) {
    showToast(t('listErr'), true);
  } finally {
    renderDebugPanel();
  }
}

el('salesperson').addEventListener('change', (e) => {
  const sp = salespersons.find(s => s.id === e.target.value);
  selectedSalesperson = sp || null;
  updatePreview();
});

/* ---------- tabs ---------- */
function switchTab(tab){
  el('tabNew').style.display = tab === 'new' ? 'block' : 'none';
  el('tabMine').style.display = tab === 'mine' ? 'block' : 'none';
  el('tabSummary').style.display = tab === 'summary' ? 'block' : 'none';
  el('tabNewBtn').classList.toggle('active', tab === 'new');
  el('tabMineBtn').classList.toggle('active', tab === 'mine');
  el('tabSummaryBtn').classList.toggle('active', tab === 'summary');
  el('submitBar').style.display = tab === 'new' ? 'block' : 'none';
  el('viewAsField').style.display = (isFinance && tab !== 'new') ? 'block' : 'none';
  if (tab === 'mine') loadMyReceipts();
  if (tab === 'summary') loadSummary();
}

/* ---------- my receipts: load + render ---------- */
async function loadMyReceipts(){
  const list = el('myReceiptsList');
  if (!viewedSalesperson) {
    list.innerHTML = `<div class="empty-state">${t('selectFirst')}</div>`;
    return;
  }
  list.innerHTML = `<div class="empty-state">${t('mineLoading')}</div>`;
  try {
    const res = await fetch(`${GAS_ENDPOINT}?action=myReceipts&salesId=${encodeURIComponent(viewedSalesperson.id)}&_=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    myReceiptsCache = data.receipts || [];
    renderMyReceipts();
  } catch (err) {
    list.innerHTML = `<div class="empty-state">${t('mineLoadError')}</div>`;
  }
}

function renderMyReceipts(){
  const list = el('myReceiptsList');
  if (!viewedSalesperson) return;
  if (!myReceiptsCache.length) {
    list.innerHTML = `<div class="empty-state">${t('mineEmpty')}</div>`;
    return;
  }
  const canDelete = !!(viewedSalesperson && selectedSalesperson && viewedSalesperson.id === selectedSalesperson.id);
  list.innerHTML = myReceiptsCache.map(r => {
    const voided = r.status === 'Voided';
    const billsHtml = r.bills.map(b => `
      <div class="mr-bill-line"><span>${lineHtml_(b)}</span><span class="${b.amount < 0 ? 'neg' : ''}">${formatSigned(b.amount)}</span></div>
    `).join('');
    return `
      <div class="mr-card ${voided ? 'voided' : ''}" data-receipt-id="${r.receiptId}">
        <div class="mr-head">
          <div>
            <div class="mr-date">${r.paymentDate || r.date}</div>
            <div class="mr-customer">${escH(r.customerName)}</div>
          </div>
          <div class="mr-total ${r.total < 0 ? 'neg' : ''}">${formatSigned(r.total)}</div>
        </div>
        <div class="mr-bills">${billsHtml}</div>
        <div class="mr-foot">
          <span class="mr-status">${voided ? t('voided') : t(r.paymentType === 'Cash' ? 'cash' : r.paymentType === 'Transfer' ? 'transfer' : 'cheque') + apprChip(r)}</span>
          <div class="mr-actions">
            ${(!voided && canDelete && r.approval !== 'Approved') ? `<span class="mr-action danger" data-action="delete">${t('delete')}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

el('myReceiptsList').addEventListener('click', async (e) => {
  const card = e.target.closest('.mr-card');
  const action = e.target.dataset.action;
  if (!card || !action || action !== 'delete') return;
  const receiptId = card.dataset.receiptId;

  if (!selectedSalesperson) {
    showToast(t('selectFirst'), true);
    return;
  }
  if (!confirm(t('deleteConfirm'))) return;
  const original = e.target.textContent;
  e.target.textContent = t('deleting');

  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'void', receiptId: receiptId, salesId: selectedSalesperson.id, lineUserId: profile.userId })
    });
    const result = await res.json();

    if (result && result.success) {
      showToast(t('deletedToast'));
      loadMyReceipts();
    } else {
      showToast((result && result.error) || t('deleteError'), true);
      e.target.textContent = original;
    }
  } catch (err) {
    showToast(t('deleteConnErr'), true);
    e.target.textContent = original;
  }
});

async function loadSummary(){
  const list = el('summaryList');
  const grand = el('summaryGrand');
  if (!viewedSalesperson) {
    grand.innerHTML = '';
    list.innerHTML = `<div class="empty-state">${t('selectFirst')}</div>`;
    return;
  }
  grand.innerHTML = '';
  list.innerHTML = `<div class="empty-state">${t('summaryLoading')}</div>`;
  try {
    const res = await fetch(`${GAS_ENDPOINT}?action=summary&salesId=${encodeURIComponent(viewedSalesperson.id)}&groupBy=${encodeURIComponent(summaryGroupBy)}&_=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    summaryCache = data.groups || [];
    renderSummary();
  } catch (err) {
    list.innerHTML = `<div class="empty-state">${t('summaryLoadError')}</div>`;
  }
}

function renderSummary(){
  const list = el('summaryList');
  const grand = el('summaryGrand');
  if (!viewedSalesperson) return;

  if (!summaryCache.length) {
    grand.innerHTML = '';
    list.innerHTML = `<div class="empty-state">${t('summaryEmpty')}</div>`;
    return;
  }

  const grandTotal = summaryCache.reduce((sum, g) => sum + g.total, 0);
  const gA = summaryCache.reduce((sum, g) => sum + (g.approved || 0), 0);
  const gP = summaryCache.reduce((sum, g) => sum + (g.pending || 0), 0);
  grand.innerHTML = `
    <div class="sum-grand" style="background:#1F7A4D;margin-bottom:8px"><span class="sg-label">${t('balApproved')}</span><span class="sg-total">${formatSigned(gA)}</span></div>
    <div class="sum-grand" style="background:#B8860B;margin-bottom:8px"><span class="sg-label">${t('balPending')}</span><span class="sg-total">${formatSigned(gP)}</span></div>
    <div class="hint" style="margin:0 4px 14px">${t('apprNote')} · ${t('grandTotal')}: ${formatSigned(grandTotal)}</div>
  `;

  list.innerHTML = summaryCache.map(g => {
    const label = summaryGroupBy === 'month' ? formatMonthLabel(g.label) : g.label;
    const countLabel = g.count === 1 ? t('receipt') : t('receipts');
    return `
      <div class="sum-card">
        <div>
          <div class="sum-label">${label}</div>
          <div class="sum-count">${g.count} ${countLabel}</div>
          <div class="sum-count">✅ ${money(g.approved || 0)} · ⏳ ${money(g.pending || 0)}</div>
        </div>
        <div class="sum-total ${g.total < 0 ? 'neg' : ''}">${formatSigned(g.total)}</div>
      </div>
    `;
  }).join('');
}

function formatMonthLabel(yyyyMM){
  const [y, m] = String(yyyyMM).split('-').map(Number);
  if (!y || !m) return yyyyMM;
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString(currentLang === 'th' ? 'th-TH' : 'en-US', { year: 'numeric', month: 'long' });
}

el('receiptForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  el('formError').className = 'error-text';

  const paymentDate = el('paymentDate').value;
  const chequeType = el('chequeType').value.trim();
  const chequeDate = el('chequeDate').value;

  // every line needs an amount; invoices/credit notes need a customer + number; notes need a name + comment
  const rowsIncomplete = billRows.some(r => !(parseFloat(r.amount) > 0) ||
    (r.type === 'Note' ? (!r.noteCustomer.trim() || !r.noteText.trim()) : (!r.customer || !r.billNo.trim())));

  if (!selectedSalesperson || billRows.length === 0 || rowsIncomplete ||
      !paymentType || !paymentDate || receiptImages.length === 0 ||
      (paymentType === 'Cheque' && (!chequeType || !chequeDate))) {
    el('formError').textContent = receiptImages.length === 0 ? t('formErrorPhoto') : t('formErrorDefault');
    el('formError').className = 'error-text show';
    return;
  }

  const btn = el('submitBtn');
  btn.disabled = true;
  btn.textContent = t('saving');

  const bills = getSignedBills();
  const totalAmount = bills.reduce((sum, b) => sum + b.amount, 0);

  const payload = {
    salesperson: selectedSalesperson.name,
    salesId: selectedSalesperson.id,
    // kept for older server versions; the server now reads the customer from every line
    customerId: bills[0].customerId,
    customerName: bills[0].customerName,
    bills: bills,
    totalAmount: totalAmount,
    paymentType: paymentType,
    paymentDate: paymentDate,
    chequeType: paymentType === 'Cheque' ? chequeType : '',
    chequeDate: paymentType === 'Cheque' ? chequeDate : '',
    receiptImages: receiptImages,
    receiptImage: receiptImages[0] || '',
    lineUserId: profile.userId,
    lineDisplayName: profile.displayName
  };

  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if (!result || !result.success) {
      showToast((result && result.error) || t('saveErr'), true);
      btn.disabled = false;
      btn.textContent = t('saveReceipt');
      return;
    }

    showToast(t('savedToast'));
    setTimeout(() => {
      // guests stay in the app: reloading unlocks their stop-supply view
      if (!isGuest && window.liff && liff.isInClient()) { liff.closeWindow(); }
      else { window.location.reload(); }
    }, 900);
  } catch (err) {
    showToast(t('saveConnErr'), true);
    btn.disabled = false;
    btn.textContent = t('saveReceipt');
  }
});

/* ---------- state + helpers ---------- */
const PROBS = ['No funds', 'Disputed bill', 'Cannot contact', 'Other'];
let odData = null, odFilter = 'needs', odQuery = '', odOpen = {}, odDraft = {}, odReq = 0, odSaving = false;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtIso = s => { const p = String(s || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : (s || ''); };
const probName = v => { const i = PROBS.indexOf(v); return i < 0 ? v : t('odp' + i); };
const odVisible = () => el('tabOverdue').style.display !== 'none';

// "today" always comes from the server so the phone's clock/timezone can never disagree with the sheet
function base(){ const p = odData.today.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
function quickDate(k){
  const b = base();
  return k === 'eom' ? iso(new Date(b.y, b.m, 0)) : iso(new Date(b.y, b.m - 1, b.d + Number(k)));
}
const posInv = c => c.invoices.filter(i => !i.credit);
const oldInv = c => c.invoices.filter(i => i.old);
const dayClass = (n, oldDays) => n >= oldDays ? 'd3' : (n >= 30 ? 'd2' : 'd1');

function getDraft(c){
  if (!odDraft[c.uid]) {
    const keep = c.answered && c.last;
    const d = { date: keep ? c.last.payDate : '', problem: keep ? c.last.problem : '', note: keep ? c.last.note : '', old: {} };
    if (keep) c.invoices.forEach(i => { if (i.old && i.oldNote) d.old[i.invoiceNo] = i.oldNote; });
    odDraft[c.uid] = d;
  }
  return odDraft[c.uid];
}

/* ---------- rendering ---------- */
function lineHtml(i){
  if (i.credit) return `<div class="od-line cn"><span><b>${esc(i.invoiceNo)}</b> · ${t('odCn')}</span><span>${formatSigned(i.amount)}</span></div>`;
  return `<div class="od-line"><span><b>${esc(i.invoiceNo)}</b> · ${t('odDue')} ${esc(i.dueDate)}<span class="od-chip ${dayClass(i.days, odData.oldDays)}">${i.days}${t('odDays')}</span></span><span>${formatSigned(i.amount)}</span></div>`;
}

function formHtml(c){
  const d = getDraft(c);
  const quick = [['3','odQ3'],['7','odQ7'],['14','odQ14'],['eom','odEom']]
    .map(([k, lab]) => `<button type="button" class="od-pill ${d.date && d.date === quickDate(k) ? 'on' : ''}" data-q="${k}">${t(lab)}</button>`).join('');
  const probs = [`<button type="button" class="od-pill ${!d.problem ? 'on' : ''}" data-p="">${t('odNoProb')}</button>`]
    .concat(PROBS.map((p, i) => `<button type="button" class="od-pill ${d.problem === p ? 'on' : ''}" data-p="${esc(p)}">${t('odp' + i)}</button>`)).join('');
  const note = d.problem ? `
      <label class="od-lbl">${t('odNote')} ${d.problem === 'Other' ? '<span class="req">*</span>' : t('odNoteOpt')}</label>
      <textarea class="od-note">${esc(d.note)}</textarea>` : '';
  const olds = oldInv(c);
  const oldBox = olds.length ? `
      <div class="od-old">
        <div class="od-oh">${tFmt('odOldTitle', { n: odData.oldDays })} <span class="req">*</span></div>
        ${olds.map(i => `<div class="od-oldrow"><div class="od-ol"><b>${esc(i.invoiceNo)}</b> · ${i.days}${t('odDays')} · ${formatSigned(i.amount)}</div>
          <textarea class="od-oldnote" data-inv="${esc(i.invoiceNo)}">${esc(d.old[i.invoiceNo] || '')}</textarea></div>`).join('')}
        ${olds.length > 1 ? `<span class="od-copy" data-act="copy">${t('odOldCopy')}</span>` : ''}
      </div>` : '';
  return `<div class="od-form">
      <label class="od-lbl">${t('odPay')} <span class="req">*</span></label>
      <div class="od-pills">${quick}</div>
      <input type="date" class="od-date" min="${odData.today}" value="${esc(d.date)}" />
      <label class="od-lbl">${t('odProbQ')}</label>
      <div class="od-pills">${probs}</div>
      ${note}${oldBox}
      <div class="od-err"></div>
      <button type="button" class="od-save">${t('odSave')}</button>
    </div>`;
}

function cardHtml(c){
  const open = !!odOpen[c.uid];
  const hasProb = c.answered && c.last && c.last.problem;
  const cls = hasProb ? 'prob' : (c.answered ? 'done' : (c.needsReply ? 'need' : ''));
  const n = posInv(c).length;
  const allView = odData.viewing === '*';
  let status = c.needsReply ? `<span class="od-chip need">${t('odNeedsReply')}</span>` : `<span class="od-chip" style="background:#f1eeee;color:#65605F">${t('odOptional')}</span>`;
  if (c.answered && c.last) {
    status = `<span class="od-chip ok">${tFmt('odPays', { d: fmtIso(c.last.payDate) })}</span>` +
      (hasProb ? `<span class="od-chip prob">${tFmt('odProbLabel', { p: esc(probName(c.last.problem)) })}</span>` : '') +
      (!odData.readOnly ? `<span class="od-chip need" style="background:none;padding-left:0">${t('odEdit')}</span>` : '');
  }
  let body = '';
  if (open) {
    const lastBox = (odData.readOnly && c.last)
      ? `<div class="od-last"><b>${t('odLastReply')}</b> (${esc(c.last.at)})<br>${tFmt('odPays', { d: fmtIso(c.last.payDate) })}${c.last.problem ? '<br>' + esc(probName(c.last.problem)) + (c.last.note ? ': ' + esc(c.last.note) : '') : ''}</div>`
      : (odData.readOnly ? `<div class="od-last">${t('odNoReply')}</div>` : '');
    body = `<div class="od-body">${c.invoices.map(lineHtml).join('')}${lastBox}${odData.readOnly ? '' : formHtml(c)}</div>`;
  }
  return `<div class="od-card ${cls}" data-cid="${esc(c.uid)}">
    <div class="od-head"><div><div class="od-name">${esc(c.customerName)}</div>
      <div class="od-sub">${esc(c.customerId)} · ${n === 1 ? t('odInv1') : tFmt('odInvN', { n: n })}${allView ? ' · 👤 ' + esc(c.salesName) : ''}</div>${status}</div>
      <div class="od-right"><div class="od-amt ${c.total < 0 ? 'neg' : ''}">${formatSigned(c.total)}</div>
      <span class="od-chip ${dayClass(c.maxDays, odData.oldDays)}">${tFmt('odOldest', { n: c.maxDays })}</span></div></div>${body}</div>`;
}

function findCard(uid){
  return [...el('overdueList').children].find(n => n.dataset && n.dataset.cid === uid) || null;
}
function refreshCard(uid){
  const c = odData.customers.find(x => x.uid === uid), node = findCard(uid);
  if (c && node) node.outerHTML = cardHtml(c);
}

function renderOverdue(){
  if (!odData) return;
  const all = odData.customers;
  const must = all.filter(c => c.mustReply);
  const answered = must.filter(c => c.answered).length;
  const total = all.reduce((s, c) => s + c.total, 0);
  const suffix = odData.viewing === '*' ? ' · ' + t('odAllView') : (odData.readOnly ? ' · ' + t('odReadOnly') : '');
  el('odHero').innerHTML = `<div class="sum-grand od-hero" style="margin-bottom:12px">
      <div class="sg-label">${t('odTotal')}${suffix}${odData.viewing === '*' ? ' · ' + t('odReadOnly') : ''}</div>
      <div class="sg-total" style="margin:2px 0 4px">${formatSigned(total)}</div>
      <div class="sg-label">${must.length ? tFmt('odOfMust', { a: answered, b: must.length, n: odData.oldDays }) : t('odNoMust')}</div>
      <div style="height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:10px;overflow:hidden"><div style="width:${must.length ? Math.round(answered / must.length * 100) : 100}%;height:100%;background:#fff"></div></div></div>`;
  [...el('odFilter').children].forEach(b => b.classList.toggle('active', b.dataset.f === odFilter));

  const q = odQuery.trim().toLowerCase();
  let cs = all;
  if (q) cs = cs.filter(c => c.customerName.toLowerCase().includes(q) || c.customerId.toLowerCase().includes(q) || (c.salesName || '').toLowerCase().includes(q));
  if (odFilter === 'needs') cs = cs.filter(c => c.needsReply);
  else if (odFilter === 'prob') cs = cs.filter(c => c.answered && c.last && c.last.problem);

  if (!cs.length) {
    el('overdueList').innerHTML = `<div class="empty-state">${q ? t('odNoMatch') : (all.length ? t('odAllDone') : t('odNone'))}</div>`;
    return;
  }
  let html = '', shownDivider = false;
  cs.forEach((c, idx) => {
    if (odFilter === 'all' && c.answered && !shownDivider && idx > 0) { html += `<div class="od-divider">${t('odReplied')}</div>`; shownDivider = true; }
    html += cardHtml(c);
  });
  el('overdueList').innerHTML = html;
}

async function loadOverdue(quiet){
  if (isGuest) return;
  const box = el('overdueList');
  if (!viewedSalesperson) { if (!quiet) { el('odHero').innerHTML = ''; box.innerHTML = `<div class="empty-state">${t('selectFirst')}</div>`; } return; }
  if (!profile.userId)    { if (!quiet) { el('odHero').innerHTML = ''; box.innerHTML = `<div class="empty-state">${t('identityFail')}</div>`; } return; }
  const my = ++odReq;
  if (!quiet) { el('odHero').innerHTML = ''; box.innerHTML = `<div class="empty-state">${t('mineLoading')}</div>`; }
  try {
    // Finance can pick "All salespeople" (value "*") in the viewer switcher
    const vid = (isFinance && el('viewAsSelect').value === '*') ? '*' : viewedSalesperson.id;
    const url = `${GAS_ENDPOINT}?action=overdue&lineUserId=${encodeURIComponent(profile.userId)}&viewSalesId=${encodeURIComponent(vid)}&_=${Date.now()}`;
    const d = await (await fetch(url, { cache: 'no-store' })).json();
    if (my !== odReq) return;
    if (d.error === 'notRegistered') { if (!quiet || odVisible()) { el('odHero').innerHTML = ''; box.innerHTML = `<div class="empty-state">${t('odNotReg')}</div>`; } return; }
    if (d.error) throw new Error(d.error);
    odData = d;
    const ids = {}; d.customers.forEach(c => { ids[c.uid] = 1; });
    Object.keys(odDraft).forEach(k => { if (!ids[k]) delete odDraft[k]; });
    if (d.viewing === d.me) el('odBadge').textContent = d.customers.filter(c => c.needsReply).length || '';
    if (odVisible()) renderOverdue();
  } catch (err) {
    if (my === odReq && (!quiet || odVisible())) box.innerHTML = `<div class="empty-state">${t('mineLoadError')}</div>`;
  }
}

function storeInput(e){
  const card = e.target.closest('.od-card'); if (!card) return;
  const c = odData && odData.customers.find(x => x.uid === card.dataset.cid); if (!c) return;
  const d = getDraft(c);
  if (e.target.classList.contains('od-date')) { d.date = e.target.value; [...card.querySelectorAll('[data-q]')].forEach(b => b.classList.toggle('on', d.date === quickDate(b.dataset.q))); }
  else if (e.target.classList.contains('od-note')) d.note = e.target.value;
  else if (e.target.classList.contains('od-oldnote')) d.old[e.target.dataset.inv] = e.target.value;
}
el('overdueList').addEventListener('input', storeInput);
el('overdueList').addEventListener('change', storeInput);

el('overdueList').addEventListener('click', async (e) => {
  const card = e.target.closest('.od-card'); if (!card || !odData) return;
  const uid = card.dataset.cid;
  const c = odData.customers.find(x => x.uid === uid); if (!c) return;

  if (e.target.closest('.od-head')) { odOpen[uid] = !odOpen[uid]; refreshCard(uid); return; }
  if (odData.readOnly) return;       // no forms in view-only mode (other salesperson / All)
  const d = getDraft(c);

  const q = e.target.closest('[data-q]');
  if (q) { d.date = quickDate(q.dataset.q); refreshCard(uid); return; }

  const p = e.target.closest('[data-p]');
  if (p) { d.problem = p.dataset.p; refreshCard(uid); return; }

  if (e.target.dataset.act === 'copy') {
    const olds = oldInv(c);
    const src = olds.map(i => (d.old[i.invoiceNo] || '').trim()).find(Boolean);
    if (src) olds.forEach(i => { if (!(d.old[i.invoiceNo] || '').trim()) d.old[i.invoiceNo] = src; });
    refreshCard(uid); return;
  }

  if (e.target.classList.contains('od-save')) {
    if (odSaving) return;
    const err = card.querySelector('.od-err');
    const fail = msg => { err.textContent = msg; err.className = 'od-err show'; };
    err.className = 'od-err';
    if (!d.date) return fail(t('odErrDate'));
    if (d.date < odData.today) return fail(t('odErrPast'));
    if (d.problem === 'Other' && !(d.note || '').trim()) return fail(t('odErrOther'));
    const olds = oldInv(c);
    if (olds.some(i => !(d.old[i.invoiceNo] || '').trim())) return fail(tFmt('odErrOld', { n: odData.oldDays }));

    const oldNotes = {}; olds.forEach(i => { oldNotes[i.invoiceNo] = d.old[i.invoiceNo].trim(); });
    const btn = e.target; odSaving = true; btn.disabled = true; btn.textContent = t('odSaving');
    try {
      const res = await (await fetch(GAS_ENDPOINT, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'followup', lineUserId: profile.userId, customerId: c.customerId, payDate: d.date,
          problem: d.problem, note: d.problem ? (d.note || '').trim() : '', oldNotes: oldNotes })
      })).json();
      if (!res || !res.success) { fail((res && res.error) || t('saveErr')); btn.disabled = false; btn.textContent = t('odSave'); }
      else { delete odDraft[uid]; odOpen[uid] = false; showToast(t('odSaved')); await loadOverdue(true); }
    } catch (x) { fail(t('saveConnErr')); btn.disabled = false; btn.textContent = t('odSave'); }
    finally { odSaving = false; }
  }
});
